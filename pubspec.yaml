name: loyalty_app
description: DSI Group Loyalty Application for Sri Lanka
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Local Storage
  shared_preferences: ^2.2.2

  # QR Code
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Image Picker & Upload
  image_picker: ^1.0.5
  file_picker: ^10.0.0

  # Notifications
  flutter_local_notifications: ^19.5.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  permission_handler: ^11.1.0
  google_fonts: ^6.3.2
  sizer: ^3.1.3
  icons_plus: ^5.0.0
  
  # Sharing & Image
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  http: ^1.2.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

