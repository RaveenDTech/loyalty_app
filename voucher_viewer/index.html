<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSI Group – Voucher Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-elevated: #1e293b;
      --surface: #1e293b;
      --surface-hover: #1a2332;
      --primary: #14B8A6;
      --primary-soft: rgba(20, 184, 166, 0.12);
      --primary-glow: rgba(20, 184, 166, 0.25);
      --accent: #8b5cf6;
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.15);
      --success-glow: rgba(16, 185, 129, 0.2);
      --error: #ef4444;
      --error-soft: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --muted: #6b7280;
      --text: #f3f4f6;
      --text-secondary: #9ca3af;
      --border: rgba(255, 255, 255, 0.06);
      --radius: 16px;
      --radius-lg: 24px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 40px rgba(20, 184, 166, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px 32px;
      position: relative;
      overflow-x: hidden;
    }

    .page::before {
      content: '';
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      max-width: 600px;
      height: 50vh;
      background: radial-gradient(ellipse 80% 70% at 50% 0%, var(--primary-glow) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-height: 0;
    }

    /* Center slot: voucher (or error) always centered on screen */
    .content-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 280px;
      padding: 24px 0;
    }

    .content-center > * {
      width: 100%;
    }

    /* Header – transparent PNG logo only, no solid background */
    .header {
      flex-shrink: 0;
      text-align: center;
      margin-bottom: 24px;
      background: none;
    }
    .brand {
      display: block;
      margin-bottom: 10px;
      background: none;
      padding: 0;
      border: none;
    }
    .brand-logo {
      display: block;
      max-width: 220px;
      max-height: 56px;
      width: auto;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
      background: none;
      border: none;
      box-shadow: none;
    }
    .header-tagline {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .header-badge svg {
      width: 14px;
      height: 14px;
      opacity: 0.8;
    }

    /* Voucher card – real gift voucher style */
    .voucher-wrap {
      position: relative;
      margin-bottom: 28px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .voucher-card {
      background: linear-gradient(180deg, #1a2332 0%, #151c28 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    /* Status ribbon – top right corner like real vouchers */
    .voucher-ribbon {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 2;
      padding: 8px 20px;
      font-size: 0.6875rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fff;
      border-radius: 0 0 0 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .voucher-ribbon.valid {
      background: linear-gradient(135deg, var(--success) 0%, #0d9668 100%);
    }
    .voucher-ribbon.expired {
      background: linear-gradient(135deg, var(--error) 0%, #c23a3a 100%);
    }
    .voucher-ribbon.redeemed {
      background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
    }
    .voucher-ribbon.pending {
      background: linear-gradient(135deg, var(--muted) 0%, #4b5563 100%);
    }

    /* Top band – GIFT VOUCHER title */
    .voucher-head {
      padding: 20px 24px 16px;
      text-align: center;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
      position: relative;
    }
    .voucher-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
    }
    .voucher-vendor {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 6px;
    }

    /* Main value – hero of the card (like real gift cards) */
    .voucher-value-block {
      padding: 28px 24px 24px;
      text-align: center;
      background: linear-gradient(180deg, rgba(20, 184, 166, 0.08) 0%, transparent 100%);
    }
    .voucher-value-label {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .voucher-value-amount {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    /* Perforation / tear line */
    .voucher-perforation {
      height: 0;
      border: none;
      border-top: 2px dashed rgba(255, 255, 255, 0.15);
      margin: 0 20px;
      position: relative;
    }
    .voucher-perforation::before {
      content: '✂ Tear along line';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: #151c28;
      padding: 0 8px;
      white-space: nowrap;
    }

    /* Code section – PIN/code area like on back of gift card */
    .voucher-code-section {
      padding: 20px 24px 24px;
    }
    .voucher-code-label {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .voucher-code-box {
      background: var(--bg);
      border: 2px solid rgba(20, 184, 166, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
    }
    .voucher-code-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.2em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
      font-family: 'Plus Jakarta Sans', ui-monospace, monospace;
    }

    /* Dates row – Issued / Valid until as chips (compact) */
    .voucher-dates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 20px 12px;
      border-top: 1px solid var(--border);
    }
    .voucher-date-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }
    .voucher-date-chip.redeemed {
      grid-column: 1 / -1;
    }
    .voucher-date-label {
      display: block;
      font-size: 0.5625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .voucher-date-value {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Redeem button */
    .voucher-redeem-wrap {
      padding: 16px 24px 8px;
      border-top: 1px solid var(--border);
    }
    .voucher-redeem-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      font-size: 0.9375rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--success) 0%, #0d9668 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .voucher-redeem-btn:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .voucher-redeem-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .voucher-redeem-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .voucher-redeem-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px 24px;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .voucher-redeem-loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: voucher-spin 0.8s linear infinite;
    }
    @keyframes voucher-spin {
      to { transform: rotate(360deg); }
    }

    /* Verified / terms line – small print */
    .card-verified {
      padding: 14px 24px 18px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .card-verified svg {
      width: 14px;
      height: 14px;
      color: var(--success);
      flex-shrink: 0;
    }

    /* Error state */
    .error-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .error-icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: var(--error-soft);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--error);
    }
    .error-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .error-card p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      max-width: 280px;
      margin: 0 auto;
    }

    /* Page footer */
    .page-footer {
      flex-shrink: 0;
      padding-top: 24px;
      text-align: center;
    }
    .demo-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .demo-cta:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
    }
    .page-footer-note {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 20px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    /* Powered by & Copyright footer */
    .footer-powered {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .footer-powered-by {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .footer-powered-by img {
      height: 24px;
      width: auto;
      object-fit: contain;
      background: none;
    }
    .footer-copyright {
      font-size: 0.6875rem;
      color: var(--muted);
    }

    /* Mobile: compact padding and typography */
    @media (max-width: 479px) {
      .page {
        padding: 16px 16px 24px;
      }
      .content-center {
        min-height: 220px;
        padding: 16px 0;
      }
      .header {
        margin-bottom: 20px;
      }
      .brand-logo {
        max-width: 180px;
        max-height: 48px;
      }
      .header-tagline {
        font-size: 0.75rem;
      }
      .header-badge {
        font-size: 0.6875rem;
        padding: 5px 10px;
      }
      .voucher-wrap {
        max-width: 100%;
        margin-bottom: 20px;
      }
      .voucher-card {
        border-radius: 16px;
      }
      .voucher-ribbon {
        padding: 6px 14px;
        font-size: 0.625rem;
        letter-spacing: 0.06em;
      }
      .voucher-head {
        padding: 16px 16px 12px;
      }
      .voucher-title {
        font-size: 0.6875rem;
        letter-spacing: 0.15em;
      }
      .voucher-vendor {
        font-size: 0.875rem;
      }
      .voucher-value-block {
        padding: 20px 16px 18px;
      }
      .voucher-value-amount {
        font-size: 1.75rem;
      }
      .voucher-perforation {
        margin: 0 16px;
      }
      .voucher-perforation::before {
        font-size: 0.5625rem;
        padding: 0 6px;
      }
      .voucher-code-section {
        padding: 16px 16px 20px;
      }
      .voucher-code-box {
        padding: 12px 14px;
        border-radius: 10px;
      }
      .voucher-code-value {
        font-size: 1rem;
        letter-spacing: 0.12em;
      }
      .voucher-dates {
        padding: 8px 16px 10px;
        gap: 6px;
      }
      .voucher-date-chip {
        padding: 6px 8px;
        border-radius: 6px;
      }
      .voucher-date-label {
        font-size: 0.5rem;
        margin-bottom: 2px;
      }
      .voucher-date-value {
        font-size: 0.6875rem;
      }
      .card-verified {
        padding: 12px 16px 14px;
        font-size: 0.625rem;
      }
      .page-footer {
        padding-top: 24px;
      }
      .page-footer-note {
        font-size: 0.6875rem;
        padding: 0 8px;
      }
      .footer-powered {
        margin-top: 24px;
        padding-top: 16px;
      }
      .error-card {
        padding: 32px 20px;
      }
    }

    /* Laptop / desktop: wider container, more breathing room */
    @media (min-width: 768px) {
      .page {
        padding: 32px 24px 40px;
      }
      .content-center {
        min-height: 320px;
        padding: 32px 0;
      }
      .container {
        max-width: 480px;
      }
      .voucher-wrap {
        max-width: 440px;
      }
      .voucher-head {
        padding: 24px 28px 18px;
      }
      .voucher-vendor {
        font-size: 1rem;
      }
      .voucher-value-block {
        padding: 32px 28px 28px;
      }
      .voucher-value-amount {
        font-size: 2.5rem;
      }
      .voucher-code-section {
        padding: 24px 28px 28px;
      }
      .voucher-code-value {
        font-size: 1.375rem;
      }
      .voucher-dates {
        padding: 12px 28px 14px;
        gap: 10px;
      }
      .voucher-date-chip {
        padding: 10px 12px;
      }
      .voucher-date-value {
        font-size: 0.8125rem;
      }
      .card-verified {
        padding: 16px 28px 20px;
      }
    }

    /* Large desktop: optional max width so card doesn’t look tiny */
    @media (min-width: 1024px) {
      .page::before {
        max-width: 520px;
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <header class="header">
        <div class="brand">
          <img src="https://dsi.lk/wp-content/uploads/2024/02/logo.png" alt="DSI Samson group – Welcoming possibilities" class="brand-logo" />
        </div>
        <p class="header-tagline">Gift Voucher Verification</p>
        <div class="header-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Secure status check · No app required
        </div>
      </header>

      <div class="content-center">
        <div id="content"></div>
      </div>

      <footer class="page-footer">
        
        <p class="page-footer-note">Share this link with recipients so they can verify voucher status in any browser.</p>
        <div class="footer-powered">
          <div class="footer-powered-by">
            <span>Powered by</span>

            <span>DTech  (PVT)  Ltd</span>
          </div>
          <p class="footer-copyright">© Copyright Dtech. All rights reserved.</p>
        </div>
      </footer>
    </div>
  </div>
  <script>
    (function () {
      // Parse voucher from URL. Two formats:
      // 1) ?data=<base64-json>   e.g. ?data=eyJ2b3VjaGVyQ29kZSI6IkRTSy0uLiJ9
      // 2) ?voucher=<url-encoded-json>
      // JSON shape: { voucherCode, vendorName, amount, status?, purchasedAt?, expiresAt?, redeemedAt? }
      const VOUCHER_PARAM = 'voucher';
      const DATA_PARAM = 'data';

      // Google Sheet backend: set this to your Apps Script Web app URL (Deploy > New deployment > Web app).
      // Leave empty to disable redeem and sheet sync (status from URL only).
      const SHEET_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbyyoFevfZWVg5oanTZCGlRNKs2XsyuLxahINE7jVnqIkCN2T4dE7oUhre7ueaL47kZg/exec'; // e.g. 'https://script.google.com/macros/s/AKfycbz.../exec'

      function getJsonFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const voucherParam = params.get(VOUCHER_PARAM);
        const dataParam = params.get(DATA_PARAM);
        if (voucherParam) {
          try {
            return JSON.parse(decodeURIComponent(voucherParam));
          } catch (e) {
            return null;
          }
        }
        if (dataParam) {
          try {
            return JSON.parse(atob(dataParam));
          } catch (e) {
            return null;
          }
        }
        return null;
      }

      function buildStatus(voucher) {
        const status = (voucher.status || '').toLowerCase();
        const expiresAt = voucher.expiresAt ? new Date(voucher.expiresAt) : null;
        const isExpiredByDate = expiresAt && expiresAt < new Date();
        if (status === 'redeemed') {
          return { text: 'Redeemed', className: 'redeemed', icon: '✓' };
        }
        if (isExpiredByDate || status === 'expired') {
          return { text: 'Expired', className: 'expired', icon: '✕' };
        }
        return { text: 'Valid', className: 'valid', icon: '✓' };
      }

      function canRedeem(voucher) {
        const s = buildStatus(voucher);
        return s.className === 'valid';
      }

      // Google Apps Script often has 20–30s "cold start" on first request; allow time and retry once
      var SHEET_FETCH_TIMEOUT_MS = 28000;

      function sheetFetchStatus(code, cb, isRetry) {
        if (!SHEET_SCRIPT_URL || !code) {
          console.log('[Google Sheet] Status fetch skipped: ' + (!SHEET_SCRIPT_URL ? 'SHEET_SCRIPT_URL not set' : 'no voucher code'));
          if (cb) cb(null);
          return;
        }
        console.log('[Google Sheet] Establishing connection – fetching status for code:', code + (isRetry ? ' (retry)' : ''));
        var done = false;
        function finish(status) {
          if (done) return;
          done = true;
          if (timeoutId) clearTimeout(timeoutId);
          window[callbackName] = function () {}; /* no-op so late script response does not throw */
          if (cb) cb(status);
        }
        const callbackName = 'sheetStatus_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        window[callbackName] = function (data) {
          var status = data && data.status ? data.status.toLowerCase() : null;
          var redeemedAt = data && data.redeemedAt ? data.redeemedAt : null;
          console.log('[Google Sheet] Connection OK – status:', status || '(none)', redeemedAt ? ', redeemedAt: ' + redeemedAt : '');
          finish({ status: status, redeemedAt: redeemedAt });
        };
        var timeoutId = setTimeout(function () {
          timeoutId = null;
          if (!isRetry) {
            console.warn('[Google Sheet] First attempt timed out (Apps Script may be cold). Retrying once…');
            sheetFetchStatus(code, cb, true);
            return;
          }
          console.warn('[Google Sheet] Connection timeout (' + (SHEET_FETCH_TIMEOUT_MS / 1000) + 's) after retry – using URL status');
          finish(null);
        }, SHEET_FETCH_TIMEOUT_MS);
        const url = SHEET_SCRIPT_URL + '?action=status&code=' + encodeURIComponent(code) + '&callback=' + callbackName;
        const script = document.createElement('script');
        script.src = url;
        script.onerror = function () {
          if (!isRetry) {
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = null;
            console.warn('[Google Sheet] First attempt failed. Retrying once…');
            sheetFetchStatus(code, cb, true);
            return;
          }
          console.error('[Google Sheet] Connection failed – script load error (ERR_CONNECTION_CLOSED or CORS)');
          finish(null);
        };
        document.head.appendChild(script);
        script.remove();
      }

      function sheetRedeem(code, cb) {
        if (!SHEET_SCRIPT_URL || !code) {
          console.log('[Google Sheet] Redeem skipped: ' + (!SHEET_SCRIPT_URL ? 'SHEET_SCRIPT_URL not set' : 'no voucher code'));
          if (cb) cb({ error: 'Sheet URL or code missing' });
          return;
        }
        console.log('[Google Sheet] Establishing connection – redeeming code:', code);
        var done = false;
        function finish(data) {
          if (done) return;
          done = true;
          if (timeoutId) clearTimeout(timeoutId);
          window[callbackName] = function () {}; /* no-op so late script response does not throw */
          if (cb) cb(data || {});
        }
        const callbackName = 'sheetRedeem_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        window[callbackName] = function (data) {
          if (data && data.ok) {
            console.log('[Google Sheet] Connection OK – redeem successful');
          } else {
            console.error('[Google Sheet] Redeem response error:', data && data.error ? data.error : data);
          }
          finish(data);
        };
        var timeoutId = setTimeout(function () {
          timeoutId = null;
          console.warn('[Google Sheet] Redeem timeout (' + (SHEET_FETCH_TIMEOUT_MS / 1000) + 's). If the script was cold, try again.');
          finish({ error: 'Request timed out. The server may be starting up – please try Redeem again.' });
        }, SHEET_FETCH_TIMEOUT_MS);
        const url = SHEET_SCRIPT_URL + '?action=redeem&code=' + encodeURIComponent(code) + '&callback=' + callbackName;
        const script = document.createElement('script');
        script.src = url;
        script.onerror = function () {
          console.error('[Google Sheet] Connection failed – script load error (redeem)');
          finish({ error: 'Request failed. Connection refused or script URL invalid.' });
        };
        document.head.appendChild(script);
        script.remove();
      }

      function formatDate(iso) {
        if (!iso) return '–';
        const d = new Date(iso);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      function formatDateLong(iso) {
        if (!iso) return '–';
        const d = new Date(iso);
        return d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
      }

      function formatAmount(amount) {
        if (amount == null) return '–';
        return 'Rs. ' + Number(amount).toLocaleString('en-LK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function escapeHtml(s) {
        if (s == null) return '–';
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      const ICONS = {
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
        cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        store: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="M4 6l2-4h12l2 4"/><path d="M8 10v6"/><path d="M12 10v6"/><path d="M16 10v6"/></svg>',
        currency: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
        calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
        redeemed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        verified: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
      };

      let currentVoucher = null;
      let redeemInProgress = false;
      let redeemAreaLoading = false;

      function renderVoucher(voucher, opts) {
        opts = opts || {};
        currentVoucher = voucher;
        const status = buildStatus(voucher);
        const amountText = formatAmount(voucher.amount);
        const dateChips = [];
        if (voucher.purchasedAt) dateChips.push({ label: 'Issued', value: formatDate(voucher.purchasedAt), redeemed: false });
        if (voucher.expiresAt) dateChips.push({ label: 'Valid until', value: formatDate(voucher.expiresAt), redeemed: false });
        if (voucher.redeemedAt) dateChips.push({ label: 'Redeemed', value: formatDateLong(voucher.redeemedAt), redeemed: true });
        const datesHtml = dateChips.length ? '<div class="voucher-dates">' + dateChips.map(function (c) {
          return '<div class="voucher-date-chip' + (c.redeemed ? ' redeemed' : '') + '"><span class="voucher-date-label">' + escapeHtml(c.label) + '</span><span class="voucher-date-value">' + escapeHtml(c.value) + '</span></div>';
        }).join('') + '</div>' : '';
        const showRedeem = canRedeem(voucher) && !opts.hideRedeem;
        const redeeming = redeemInProgress;
        const showRedeemArea = redeemAreaLoading || showRedeem;
        const redeemBtnHtml = showRedeemArea
          ? redeemAreaLoading
            ? '<div class="voucher-redeem-wrap"><div class="voucher-redeem-loading"><div class="voucher-redeem-loading-spinner" aria-hidden="true"></div><span>Checking status…</span></div></div>'
            : '<div class="voucher-redeem-wrap"><button type="button" class="voucher-redeem-btn" id="redeemBtn" ' + (redeeming ? 'disabled' : '') + '><span class="redeem-icon">' + ICONS.redeemed + '</span>' + (redeeming ? ' Redeeming…' : ' Redeem voucher') + '</button></div>'
          : '';
        var ribbonClass = status.className;
        var ribbonText = status.text;
        if (redeemAreaLoading) {
          ribbonClass = 'pending';
          ribbonText = 'Checking…';
        }
        const html = `
          <div class="voucher-wrap">
            <article class="voucher-card">
              <div class="voucher-ribbon ${ribbonClass}">${escapeHtml(ribbonText)}</div>
              <div class="voucher-head">
                <div class="voucher-title">Gift Voucher</div>
                <div class="voucher-vendor">${escapeHtml(voucher.vendorName || '–')}</div>
              </div>
              <div class="voucher-value-block">
                <div class="voucher-value-label">Value</div>
                <div class="voucher-value-amount">${escapeHtml(amountText)}</div>
              </div>
              <hr class="voucher-perforation" aria-hidden="true" />
              <div class="voucher-code-section">
                <div class="voucher-code-label">Voucher code</div>
                <div class="voucher-code-box">
                  <div class="voucher-code-value">${escapeHtml(voucher.voucherCode || '–')}</div>
                </div>
              </div>
              ${datesHtml}
              ${redeemBtnHtml}
              <div class="card-verified">
                ${ICONS.verified}
                Verified voucher · DSI Group Loyalty
              </div>
            </article>
          </div>
        `;
        document.getElementById('content').innerHTML = html;
        var redeemBtn = document.getElementById('redeemBtn');
        if (redeemBtn && showRedeem && !redeeming) {
          redeemBtn.addEventListener('click', function () {
            if (!currentVoucher || redeemInProgress) return;
            if (!SHEET_SCRIPT_URL) {
              alert('Redeem is disabled until the Google Sheet backend is connected.\n\nIn index.html, set SHEET_SCRIPT_URL to your Apps Script Web app URL (see voucher_viewer/README.md for setup).');
              return;
            }
            redeemInProgress = true;
            renderVoucher(currentVoucher);
            sheetRedeem(currentVoucher.voucherCode, function (data) {
              redeemInProgress = false;
              if (data && data.ok) {
                currentVoucher.status = 'redeemed';
                currentVoucher.redeemedAt = (data.redeemedAt && data.redeemedAt.trim()) ? data.redeemedAt.trim() : new Date().toISOString();
                renderVoucher(currentVoucher);
              } else {
                renderVoucher(currentVoucher);
                alert(data && data.error ? data.error : 'Could not redeem. Try again.');
              }
            });
          });
        }
      }

      function renderError(message) {
        document.getElementById('content').innerHTML = `
          <div class="error-card">
            <div class="error-icon-wrap">!</div>
            <h2>No voucher data</h2>
            <p>${escapeHtml(message)}</p>
          </div>
        `;
      }

      function buildDemoUrl() {
        const demo = {
          voucherCode: 'DSI-FASH-2024-001',
          vendorName: 'DSI Fashion Store',
          amount: 5000,
          status: 'active',
          purchasedAt: new Date().toISOString(),
          expiresAt: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString()
        };
        const base = location.origin + location.pathname;
        return base + '?' + DATA_PARAM + '=' + btoa(JSON.stringify(demo));
      }

      function init() {
        const voucher = getJsonFromUrl();
        if (!voucher || (!voucher.voucherCode && !voucher.vendorName)) {
          renderError('Open this page with a voucher link (URL with voucher data in JSON format).');
          setupDemoLink();
          return;
        }
        if (SHEET_SCRIPT_URL && voucher.voucherCode) {
          console.log('[Google Sheet] Loading voucher status from sheet for code:', voucher.voucherCode);
          redeemAreaLoading = true;
          renderVoucher(voucher);
          sheetFetchStatus(voucher.voucherCode, function (sheetData) {
            redeemAreaLoading = false;
            if (sheetData && sheetData.status) {
              voucher.status = sheetData.status;
              if (sheetData.redeemedAt) voucher.redeemedAt = sheetData.redeemedAt;
              console.log('[Google Sheet] Using sheet status for display:', sheetData.status, sheetData.redeemedAt ? ', redeemedAt: ' + sheetData.redeemedAt : '');
            } else {
              console.log('[Google Sheet] Using URL status for display:', voucher.status || '(from URL)');
            }
            renderVoucher(voucher);
          });
        } else {
          console.log('[Google Sheet] Sheet not configured or no code – using URL status only');
          renderVoucher(voucher);
        }
        setupDemoLink();
      }

      function setupDemoLink() {
        const demoLink = document.getElementById('demoLink');
        if (!demoLink) return;
        demoLink.href = buildDemoUrl();
        demoLink.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = buildDemoUrl();
        });
      }
      init();
    })();
  </script>
</body>
